<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordplay - Scripture Engagement Game</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wordplay">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#222222;--muted:#5f6368;--accent:#2e6b4f;--gold:#c8842b;--head:#3b6fb6;--heart:#c0475b;--hands:#2e8b57;}
@media (prefers-color-scheme: dark){:root{--bg:#1b1d1f;--card:#262a2d;--ink:#eeeeee;--muted:#b0b4b8;--accent:#5fbf8f;--gold:#e0a24f;}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Malayalam","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Bengali","Noto Sans Gujarati","Noto Sans Gurmukhi",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{padding:14px 20px;background:var(--accent);color:#fff}
header h1{margin:0;font-size:1.25rem;font-weight:700}
header p{margin:2px 0 0;font-size:.85rem;opacity:.9}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-size:.9rem}
nav{margin-top:8px}
nav button{background:rgba(255,255,255,.18);color:#fff;margin:4px 6px 0 0;padding:6px 12px;font-size:.88rem}
nav button.on{background:#fff;color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2,.card h3{margin:.2em 0 .5em}
.badge{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.b-head{background:var(--head)} .b-heart{background:var(--heart)} .b-hands{background:var(--hands)} .b-game{background:var(--gold)}
button{font:inherit;padding:10px 18px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;margin:6px 6px 6px 0}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid rgba(127,127,127,.35);margin:6px 0;padding:12px 14px}
button.opt.correct{background:#cfe9da;color:#111;border-color:#2e8b57}
button.opt.wrong{background:#f5d0d4;color:#111;border-color:#c0475b}
textarea,input[type=text]{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid rgba(127,127,127,.4);background:var(--bg);color:var(--ink)}
input.blank{width:auto;display:inline-block;min-width:90px;max-width:140px;padding:4px 6px;text-align:center;border-bottom:2px solid var(--gold);border-top:none;border-left:none;border-right:none;border-radius:0}
.verse{font-size:1.08rem;font-style:italic;background:var(--bg);padding:14px;border-radius:8px}
.muted{color:var(--muted);font-size:.9rem}
.feedback{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg)}
.order-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:10px;margin:6px 0}
.order-row span{flex:1}
.order-row button{margin:0;padding:6px 10px}
.score{font-weight:700;color:var(--accent)}
.icon{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:12px}
.icon svg{display:block;width:100%;max-width:240px;height:auto;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid rgba(127,127,127,.35);border-radius:10px;padding:10px;text-align:center;font-size:.92rem;margin:0;color:var(--ink)}
.tile.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.av{font-size:1.7rem;width:58px;height:58px;border-radius:50%;border:2px solid transparent;background:var(--bg);margin:0;padding:0;display:inline-flex;align-items:center;justify-content:center}
.av.sel{border-color:var(--gold);background:var(--card)}
.avatar-chip{font-size:1.3rem}
.av-svg{width:44px;height:44px;border-radius:50%;vertical-align:middle;display:inline-block}
.av-wrap{display:inline-flex;flex-direction:column;align-items:center;width:72px;margin:0 2px 6px 0}
.av-name{font-size:.78rem;margin-top:2px;text-align:center;color:var(--muted);line-height:1.2}
.av .av-svg{width:52px;height:52px}
#who .av-svg{width:30px;height:30px}
h2 .av-svg{width:40px;height:40px;margin-right:4px}
.xp{height:12px;background:rgba(127,127,127,.25);border-radius:6px;overflow:hidden;margin:8px 0}
.xp div{height:100%;background:var(--gold);width:0;transition:width .4s}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bt{background:var(--bg);border-radius:12px;padding:12px;text-align:center;font-size:.85rem}
.bt.locked{opacity:.4;filter:grayscale(1)}
.bt .ico{font-size:1.8rem}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid rgba(127,127,127,.2);text-align:left;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:#222;padding:10px 18px;border-radius:999px;font-weight:700;display:none;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:10}
#toast.show{display:block}
.xw{display:grid;gap:2px;margin:10px 0}
.xc{position:relative}
.xc input{width:100%;aspect-ratio:1;text-align:center;text-transform:uppercase;font-weight:700;font-size:clamp(12px,3.6vw,17px);border:1px solid rgba(127,127,127,.5);border-radius:4px;background:var(--card);color:var(--ink);padding:0}
.xn{position:absolute;top:1px;left:3px;font-size:9px;color:var(--muted);pointer-events:none;z-index:1}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.88rem}
.ws{display:grid;gap:2px;margin:10px 0}
.ws div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:4px;font-weight:700;font-size:clamp(11px,3.2vw,15px);cursor:pointer;user-select:none}
.ws .sel{background:var(--gold);color:#222}
.ws .found{background:#cfe9da;color:#111}
.wsw{display:inline-block;margin:2px 6px 2px 0;font-weight:700}
.wsw.done{text-decoration:line-through;opacity:.5}
@media (max-width:420px){.clues{grid-template-columns:1fr}}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;border:1px solid var(--accent);margin:6px 0 10px}
.seg button{margin:0;border-radius:0;background:transparent;color:var(--accent);padding:8px 16px}
.seg button.on{background:var(--accent);color:#fff}
textarea.tx-answers{min-height:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{margin:0;padding:8px 14px;border-radius:999px;background:transparent;color:var(--accent);border:1px solid var(--accent);font-size:.92rem}
.chip.on{background:var(--accent);color:#fff}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);color:var(--ink);border:1px solid rgba(127,127,127,.2);border-radius:14px;padding:12px;margin:0;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%;gap:4px;cursor:pointer}
.gcard .icon{width:100%;margin-bottom:6px}
.gcard strong{font-size:1rem}
.gcard .muted{font-size:.8rem;line-height:1.3}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:.68rem;padding:2px 8px;border-radius:999px;color:#fff;text-transform:uppercase;letter-spacing:.04em;display:inline-block}
.t-text{background:#3b6fb6}
.t-audio{background:#8a5a9a}
.t-video{background:#c0475b}
.soon{grid-column:1/-1;background:var(--card);border-left:4px solid var(--gold);border-radius:10px;padding:12px;font-size:.92rem}
.chip:disabled{opacity:.6;cursor:not-allowed}
.chip em{font-style:normal;font-size:.75rem;margin-left:4px}
.sel{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid rgba(127,127,127,.4);background:var(--bg);color:var(--ink)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <h1>Wordplay</h1>
      <p>Play - Feel - Live. Head - Heart - Hands journeys</p>
    </div>
    <div id="who"></div>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <div id="stage"></div>
</main>
<div id="toast"></div>

function showStartError(msg){
  var st = document.getElementById("stage");
  if(!st) return;
  st.innerHTML = '<div style="padding:16px;background:#fff;color:#222;border-radius:12px;font-family:sans-serif">' +
    '<strong>The game could not start.</strong><p>Please send this message to the developer:</p>' +
    '<code style="display:block;white-space:pre-wrap;word-break:break-word">' + String(msg).replace(/</g, "&lt;") + '</code></div>';
}
window.addEventListener("error", function(e){ showStartError((e.message || "Error") + " (line " + e.lineno + ")"); });

/* Selects content: selected book first, then same testament, then all */
function pool(items, n){
  const b = items.filter(i => i.book === ctx.book);
  const t = items.filter(i => i.book !== ctx.book && TEST(i.book) === ctx.testament);
  const o = items.filter(i => TEST(i.book) !== ctx.testament);
  return [...b, ...t, ...o].slice(0, n);
}
function notice(picked){
  const off = [...new Set(picked.filter(i => i.book !== ctx.book).map(i => i.book))];
  if(!off.length) return "";
  return `<p class="muted">${T("notice")} ${off.join(", ")}.</p>`;
}

function dayKey(d){ const x = new Date(d); return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); }
function statsFor(pid){
  const ss = DB.sessions.filter(s => s.pid === pid);
  const days = new Set(ss.map(s => dayKey(s.date)));
  let streak = 0, d = new Date();
  if(!days.has(dayKey(d))) d = new Date(Date.now() - 86400000);
  while(days.has(dayKey(d))){ streak++; d = new Date(d.getTime() - 86400000); }
  return {
    points: ss.reduce((a,s) => a + s.points, 0),
    games: ss.length,
    books: new Set(ss.map(s => s.book)).size,
    modules: new Set(ss.map(s => s.module)).size,
    ot: ss.filter(s => s.testament === "OT").length,
    nt: ss.filter(s => s.testament === "NT").length,
    heart: ss.filter(s => s.heart).length,
    hands: ss.filter(s => s.hands).length,
    streak, ss
  };
}
function levelInfo(points){
  let idx = 0;
  LEVELS.forEach((l,i) => { if(points >= l.min) idx = i; });
  const cur = LEVELS[idx], nxt = LEVELS[idx+1];
  const pct = nxt ? Math.round((points - cur.min) / (nxt.min - cur.min) * 100) : 100;
  return { cur, nxt, pct };
}
function earnedBadges(st){ return BADGES.filter(b => b.test(st)).map(b => b.id); }

  if(!q) return;
  q = String(q);
  if(REVIEW.some(r => r.q === q)) return;
  REVIEW.push({ q, a: String(a), ok: !!ok });
}
function reviewHTML(){
  if(!REVIEW.length) return "";
  return `<h3>Answers</h3><ol style="padding-left:20px">${REVIEW.map(r =>
    `<li>${r.ok ? "✓" : "✗"} ${escapeHtml(r.q)}<br><span class="muted">Answer: <strong>${escapeHtml(r.a)}</strong></span></li>`).join("")}</ol>`;
}

function audioBlock(url, label){
  return url
    ? `<audio controls preload="none" src="${url}" style="width:100%"></audio>`
    : `<p class="muted">[${label} - add a Bible Brain audio or film link in CONFIG to play here]</p>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById("toast");

}

/* ============================================================
   QUESTION RUNNER (multiple choice, used by several modules)
   ============================================================ */
function runQuestions(qs, onFinish, i=0, score=0){
  if(i >= qs.length) return onFinish(score, qs.length);
  const q = qs[i];
  document.getElementById("stage").innerHTML = `
    <div class="card">
      <p class="muted">Question ${i+1} of ${qs.length}</p>
      <h3>${q.q}</h3>
      <div id="opts"></div>
      <div id="fb"></div>
    </div>`;
  const opts = document.getElementById("opts");
  const btns = q.options.map((o,k) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      btns.forEach(x => x.disabled = true);
      const ok = k === q.correct;
      addReview(q.q, q.options[q.correct], ok);
      b.classList.add(ok ? "correct" : "wrong");
      if(!ok) btns[q.correct].classList.add("correct");
      document.getElementById("fb").innerHTML = `
        <div class="feedback">${ok ? "Correct." : "Not quite - the answer is highlighted."} ${q.note || ""}</div>
        <button id="nextq">${i+1 < qs.length ? "Next question" : "See result"}</button>`;
      document.getElementById("nextq").onclick = () => runQuestions(qs, onFinish, i+1, score + (ok ? 1 : 0));
    };
    opts.appendChild(b); return b;
  });
}

function covNode(nodes, i, acc){
  if(i >= nodes.length){
    return finishModule("Covenant Quest", acc.score, acc.max, { heart: acc.heart.filter(Boolean).join(" | "), hands: acc.hands });
  }
  const n = nodes[i];
  runQuestions([{ q: `${n.title} (${n.ref}): ${n.q}`, options: n.options, correct: n.correct, note: n.note }], score => {
    document.getElementById("stage").innerHTML = `<div class="card"><span class="badge b-game">Node ${i+1} of ${nodes.length}</span><h3>${n.title}</h3><p class="muted">${n.ref}</p></div>` + hhCard(n.heart, n.mission);

      const r = readHH();
      acc.score += score; acc.max += 1;
      acc.heart.push(r.heart); acc.hands = acc.hands || r.hands;
      covNode(nodes, i+1, acc);
    };
  });
}

  document.getElementById("sb-check").onclick = () => {
    const correctPos = sbOrder.filter((c,pos) => c === pos).length;
    addReview("Put these events in order", sbCards.join(" then "), correctPos === sbCards.length);
    document.getElementById("sb-res").innerHTML = `
      <div class="feedback"><span class="score">${correctPos} of ${sbCards.length} in place</span><br>
      ${correctPos === sbCards.length ? "Perfect order." : "Some cards are out of place. Try again or continue."}</div>
      <button id="sb-next">Continue to Heart and Hands</button>`;
    document.getElementById("sb-next").onclick = () => withHH("Story Builder", correctPos, sbCards.length, item.heart, item.mission);
  };
}
window.sbMove = (pos, dir) => {
  const t = pos + dir;
  if(t < 0 || t >= sbOrder.length) return;
  [sbOrder[pos], sbOrder[t]] = [sbOrder[t], sbOrder[pos]];
  renderStory(pool(STORY,1)[0]);
};

function runMemory(){
  const item = pool(MEMORY, 1)[0];
  const html = item.template.replace(/\[\[(.+?)\]\]/g, (_, w) => `<input class="blank" data-a="${w}">`);
  document.getElementById("stage").innerHTML = `
    <div class="card">
      <span class="badge b-head">Head - Memory Verse</span>
      <h2>${item.ref} (KJV)</h2>
      ${notice([item])}
      <p class="muted">Fill in the missing words from memory. Each blank is one word.</p>
      <div class="verse">${html}</div>
      <div style="margin-top:8px"><button id="mv-check">Check my answers</button></div>
      <div id="mv-res"></div>
    </div>`;
  document.getElementById("mv-check").onclick = () => {
    const inputs = [...document.querySelectorAll("input[data-a]")];
    let score = 0;
    inputs.forEach(i => {
      const ok = i.value.trim().toLowerCase() === i.dataset.a.toLowerCase();
      if(ok) score++;
      i.style.color = ok ? "#2e8b57" : "#c0475b";
      if(!ok) i.title = "Expected: " + i.dataset.a;
    });
    addReview("Fill in the missing words", item.template.replace(/\[\[(.+?)\]\]/g, "$1"), score === inputs.length);
    document.getElementById("mv-res").innerHTML = `
      <div class="feedback"><span class="score">${score} of ${inputs.length}</span><br>
      ${score === inputs.length ? "You remembered the whole verse." : "Words in red are incorrect. Hover over them to see the answer."}</div>
      <button id="mv-next">Continue to Heart and Hands</button>`;
    document.getElementById("mv-next").onclick = () => withHH("Memory Verse", score, inputs.length,
      "Which word in this verse speaks to you most today, and why?",
      "Say this verse aloud to one person this week and invite them to share a thought about it.");
  };
}

   (5 to 1 points), one listening round (1 point per answer).

function runOralQuiz(){
  const quick = pool(QUICK, 9);
  const who = pool(WHO_AM_I, 1)[0];
  const listen = pool(LISTENING, 1)[0];
  quizRounds = [
    ...quick.map(x => Object.assign({type:"quick"}, x)),
    Object.assign({type:"who"}, who),
    Object.assign({type:"audio"}, listen)
  ];
  const p = activePlayer();
  quizIdx = 0;
  document.getElementById("stage").innerHTML = `
    <div class="card">
      <span class="badge b-game">Oral Bible Quiz</span>
      <h2>Set up your quiz</h2>
      ${notice([...quick, who, listen])}
      <p>Enter team or player names, separated by commas. The quiz has ${quizRounds.length} rounds.</p>
      <input type="text" id="qt-names" value="${escapeHtml(p.name)}">
      <div style="margin-top:10px"><button id="qt-start">Start quiz</button></div>
    </div>`;
  document.getElementById("qt-start").onclick = () => {
    let names = document.getElementById("qt-names").value.split(",").map(s => s.trim()).filter(Boolean);
    if(!names.length) names = [p.name];
    quizTeams = [...new Set(names)];
    quizScores = {};
    quizTeams.forEach(t => quizScores[t] = 0);
    quizRound();
  };
}
function scoreboard(){
  return `<div class="feedback">${quizTeams.map(t => `<span class="badge b-game" style="margin:2px 6px 2px 0">${escapeHtml(t)}: ${quizScores[t]}</span>`).join("")}</div>`;
}
function awardButtons(pts){
  return quizTeams.map(t => `<button class="qt-award" data-t="${escapeHtml(t)}">${escapeHtml(t)} +${pts}</button>`).join("")
       + `<button id="qt-none" class="alt">No one</button>`;
}
function wireAwards(pts){
  document.querySelectorAll(".qt-award").forEach(b => b.onclick = () => {
    quizScores[b.dataset.t] += pts; quizIdx++; quizRound();
  });
  document.getElementById("qt-none").onclick = () => { quizIdx++; quizRound(); };
}
function quizRound(){
  clearInterval(quizTimer);
  if(quizIdx >= quizRounds.length) return quizFinale();
  const R = quizRounds[quizIdx];
  const label = `Round ${quizIdx+1} of ${quizRounds.length}`;
  if(R.type === "quick") return quickRound(R, label);
  if(R.type === "who") return whoRound(R, label);
  return audioRound(R, label);
}
function quickRound(R, label){
  let left = 30;
  document.getElementById("stage").innerHTML = `
    <div class="card">
      <span class="badge b-game">${label} - Quick question</span>
      <h3>${R.q}</h3>
      <div class="feedback">Time left: <span class="score" id="qt-time">30</span> seconds</div>
      <ol style="padding-left:20px">${R.options.map(o => `<li>${escapeHtml(o)}</li>`).join("")}</ol>
      <button id="qt-reveal">Reveal answer</button>
      <div id="qt-fb"></div>
      ${scoreboard()}
    </div>`;
  quizTimer = setInterval(() => {
    const t = document.getElementById("qt-time");
    if(!t){ clearInterval(quizTimer); return; }
    left--;
    t.textContent = left > 0 ? left : "Time up";
    if(left <= 0) clearInterval(quizTimer);
  }, 1000);
  document.getElementById("qt-reveal").onclick = () => {
    clearInterval(quizTimer);
    document.getElementById("qt-reveal").remove();
    document.getElementById("qt-fb").innerHTML = `
      <div class="feedback"><strong>Answer:</strong> ${R.options[R.correct]}<br>
      <span class="muted">Reference: ${R.ref}</span><br>${R.info}<br>
      <em>Heart: ${R.heart}</em></div>${awardButtons(1)}`;
    wireAwards(1);
  };
}
function whoRound(R, label){
  let shown = 0;
  const draw = () => {
    const list = R.clues.slice(0, shown).map(c => `<li>${escapeHtml(c)}</li>`).join("");
    document.getElementById("stage").innerHTML = `
      <div class="card">
        <span class="badge b-game">${label} - Who am I?</span>
        <p class="muted">Clues are revealed one at a time. The earlier the answer, the more points.</p>
        <ol style="padding-left:20px">${list}</ol>
        <p class="muted">${shown > 0 ? "Points if answered now: " + (6 - shown) : ""}</p>
        ${shown < R.clues.length ? '<button id="qt-clue">Reveal next clue</button>' : '<button id="qt-reveal">Reveal answer</button>'}
        <div id="qt-fb"></div>
        ${scoreboard()}
      </div>`;
    if(shown < R.clues.length){
      document.getElementById("qt-clue").onclick = () => { shown++; draw(); };
    } else {
      document.getElementById("qt-reveal").onclick = () => {
        const pts = 6 - shown;
        document.getElementById("qt-reveal").remove();
        document.getElementById("qt-fb").innerHTML = `
          <div class="feedback"><strong>Answer:</strong> ${R.answer} (${R.ref})<br>${R.info}<br><em>Heart: ${R.heart}</em></div>
          ${awardButtons(pts)}`;
        wireAwards(pts);
      };
    }
  };
  draw();
}
function audioRound(R, label){
  document.getElementById("stage").innerHTML = `
    <div class="card">
      <span class="badge b-game">${label} - Listening round</span>
      <h3>${R.title}</h3>
      ${CONFIG.quizAudio ? `<audio controls preload="none" src="${CONFIG.quizAudio}" style="width:100%"></audio>` : `<p class="muted">[Listening audio placeholder - add a link in CONFIG]</p>`}

      <button id="qt-go">Start the questions</button>

    runQuestions(R.questions, (score, max) => {

          <p class="muted">Award the points to the team or player who answered.</p>
          ${awardButtons(score)}
          ${scoreboard()}
        </div>`;
      wireAwards(score);
    });
  };
}
function quizFinale(){
  const ranking = [...quizTeams].sort((a,b) => quizScores[b] - quizScores[a]);

}

const BIBLE_QUIZ = [...QUICK, ...QUIZ_EXTRA];
const QUIZ_LENGTH = 10;
function shuffleArr(a){
  const b = [...a];
  for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
let bq = null;
function runBibleQuiz(){
  const same = shuffleArr(BIBLE_QUIZ.filter(q => TEST(q.book) === ctx.testament));
  const other = shuffleArr(BIBLE_QUIZ.filter(q => TEST(q.book) !== ctx.testament));
  bq = { deck: [...same, ...other].slice(0, QUIZ_LENGTH), i: 0, lives: 3, correct: 0, fifty: true, hint: true, cur: null };
  stage().innerHTML = `
    <div class="card">
      <span class="badge b-game">Bible Trivia</span>
      <h2>Test your Bible knowledge</h2>
      ${notice(bq.deck)}
      <p>${QUIZ_LENGTH} random questions. No question repeats within a quiz.</p>
      <p class="muted">You have 3 lives. A wrong answer costs one life. You also have two lifelines: 50:50 removes two wrong options, and Hint shows which book the question comes from.</p>
      <button id="bq-go">Start quiz</button>
    </div>`;
  document.getElementById("bq-go").onclick = bqQuestion;
}
function bqQuestion(){
  if(bq.lives <= 0 || bq.i >= bq.deck.length) return bqEnd();
  const q = bq.deck[bq.i];
  bq.cur = { q, order: shuffleArr(q.options.map((_, k) => k)), removed: [], answered: false };
  bqDraw();
}
function bqDraw(){
  const c = bq.cur, q = c.q;
  stage().innerHTML = `
    <div class="card">
      <span class="badge b-game">Question ${bq.i + 1} of ${bq.deck.length}</span>
      <div class="feedback">Lives: ${"❤️".repeat(bq.lives)} &nbsp; Correct so far: <span class="score">${bq.correct}</span></div>
      <h3>${escapeHtml(q.q)}</h3>
      <div style="margin:6px 0">
        <button id="bq-fifty" class="alt" ${bq.fifty && !c.answered ? "" : "disabled"}>50:50</button>
        <button id="bq-hint" class="alt" ${bq.hint && !c.answered ? "" : "disabled"}>Hint</button>
      </div>
      <div id="bq-opts"></div>
      <div id="bq-fb"></div>
    </div>`;
  const box = document.getElementById("bq-opts");
  c.order.forEach(k => {

    const b = document.createElement("button");
    b.className = "opt";
    b.dataset.k = k;
    b.textContent = q.options[k];
    b.onclick = () => bqAnswer(k);
    box.appendChild(b);
  });
  document.getElementById("bq-fifty").onclick = bqFifty;
  document.getElementById("bq-hint").onclick = bqHint;
}
function bqFifty(){
  const c = bq.cur;
  bq.fifty = false;
  c.removed = shuffleArr(c.order.filter(k => k !== c.q.correct)).slice(0, 2);
  bqDraw();
}
function bqHint(){
  bq.hint = false;
  document.getElementById("bq-hint").disabled = true;
  document.getElementById("bq-fb").innerHTML = `<div class="feedback">Hint: this question comes from the book of <strong>${escapeHtml(bq.cur.q.book)}</strong>.</div>`;
}
function bqAnswer(k){
  const c = bq.cur;
  if(c.answered) return;
  c.answered = true;
  const ok = k === c.q.correct;
  addReview(c.q.q, c.q.options[c.q.correct], ok);
  if(ok) bq.correct++; else bq.lives--;
  document.getElementById("bq-fifty").disabled = true;
  document.getElementById("bq-hint").disabled = true;
  document.querySelectorAll("#bq-opts button").forEach(b => b.disabled = true);
  const right = document.querySelector(`#bq-opts [data-k="${c.q.correct}"]`);
  if(right) right.classList.add("correct");
  if(!ok){
    const wrong = document.querySelector(`#bq-opts [data-k="${k}"]`);
    if(wrong) wrong.classList.add("wrong");
  }
  const last = bq.lives <= 0 || bq.i === bq.deck.length - 1;
  document.getElementById("bq-fb").insertAdjacentHTML("beforeend", `
    <div class="feedback">${ok ? "Correct." : "Not quite. You lost a life."} <span class="muted">Reference: ${c.q.ref}</span><br>${c.q.info}</div>
    <button id="bq-next">${last ? T("finish") : "Next question"}</button>`);
  document.getElementById("bq-next").onclick = () => { bq.i++; bqQuestion(); };
}
function bqEnd(){
  const total = bq.deck.length;
  withHH("Bible Trivia", bq.correct, total,
    `You answered ${bq.correct} of ${total} correctly. Which question today taught you something new about God's word?`,
    "Share one question from today's quiz with a friend or family member this week.");
}

function bcRound(){
  if(bc.lives <= 0 || bc.i >= bc.deck.length) return bcEnd();
  bc.shown = 1; bc.solved = false; bc.wrong = []; bc.options = null;
  bcDraw();
}
function bcDraw(){
  const c = bc.deck[bc.i];
  const done = bc.solved || bc.lives <= 0;
  if(done) addReview("Who am I? (" + c.ref + ")", c.name, bc.solved);
  const clues = c.clues.slice(0, bc.shown).map(x => `<li>${escapeHtml(x)}</li>`).join("");
  let body;
  if(done){
    const msg = bc.solved
      ? `<span class="score">Correct: ${escapeHtml(c.name)}</span> (+${6 - bc.shown} points)`
      : `Out of lives. The answer was <strong>${escapeHtml(c.name)}</strong>.`;
    const last = bc.lives <= 0 || bc.i === bc.deck.length - 1;
    body = `<div class="feedback">${msg}<br>${escapeHtml(c.info)}<br><span class="muted">Reference: ${c.ref}</span></div>
            <button id="bc-next">${last ? T("finish") : "Next character"}</button>`;
  } else {
    body = `<div style="margin:6px 0">
              ${bc.shown < c.clues.length ? '<button id="bc-clue" class="alt">Reveal next clue</button>' : ""}
              <button id="bc-guess">Guess now</button>
            </div>
            <div id="bc-opts"></div>`;
  }
  stage().innerHTML = `
    <div class="card">
      <span class="badge b-game">Character ${bc.i + 1} of ${bc.deck.length}</span>
      <div class="feedback">Lives: ${"❤️".repeat(bc.lives)} &nbsp; Points: <span class="score">${bc.points}</span></div>
      <p class="muted">Clue ${bc.shown} of ${c.clues.length}</p>
      <ol>${clues}</ol>
      ${body}
    </div>`;
  const clueBtn = document.getElementById("bc-clue");
  if(clueBtn) clueBtn.onclick = () => { bc.shown++; bcDraw(); if(bc.options) bcOptions(); };
  const guessBtn = document.getElementById("bc-guess");
  if(guessBtn) guessBtn.onclick = () => bcOptions();
  const nextBtn = document.getElementById("bc-next");
  if(nextBtn) nextBtn.onclick = () => { bc.i++; bcRound(); };
  if(!done && bc.options) bcOptions();
}
function bcOptions(){
  const c = bc.deck[bc.i];
  if(!bc.options){
    const distract = shuffleArr(BIBLE_CHARS.filter(x => x.name !== c.name).map(x => x.name)).slice(0, 3);
    bc.options = shuffleArr([c.name, ...distract]);
  }
  const box = document.getElementById("bc-opts");
  if(!box) return;
  box.innerHTML = bc.options.map(n => {
    const wrong = bc.wrong.includes(n);
    return `<button class="opt ${wrong ? "wrong" : ""}" data-n="${escapeHtml(n)}" ${wrong ? "disabled" : ""}>${escapeHtml(n)}</button>`;
  }).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => bcGuess(b.dataset.n));
}
function bcGuess(n){
  const c = bc.deck[bc.i];
  if(n === c.name){
    bc.solved = true;
    bc.points += 6 - bc.shown;
    return bcDraw();
  }
  bc.wrong.push(n);
  bc.lives--;
  bcDraw();
}
function bcEnd(){
  const max = bc.deck.length * 5;
  withHH("Bible Characters", bc.points, max,
    `You scored ${bc.points} of ${max} points. Which character from today encouraged you most?`,
    "Tell someone about one Bible character you met today and what you learned from them.");
}

function inGrid(r, c, n){ return r >= 0 && c >= 0 && r < n && c < n; }

/* Places words so they cross each other. d = 0 across, 1 down. */
function buildCrossword(list){
  const N = 24;
  const g = Array.from({length:N}, () => Array(N).fill(""));
  const words = [...list].sort((a,b) => b.w.length - a.w.length);
  const placed = [];
  const put = (it, r, c, d) => {
    for(let k = 0; k < it.w.length; k++){ g[r + (d ? k : 0)][c + (d ? 0 : k)] = it.w[k]; }
  };
  const fits = (w, r, c, d) => {
    const dr = d ? 1 : 0, dc = d ? 0 : 1, pr = d ? 0 : 1, pc = d ? 1 : 0;
    const br = r - dr, bc = c - dc, ar = r + dr * w.length, ac = c + dc * w.length;
    if(inGrid(br, bc, N) && g[br][bc]) return false;
    if(inGrid(ar, ac, N) && g[ar][ac]) return false;
    let crosses = 0;
    for(let k = 0; k < w.length; k++){
      const rr = r + dr * k, cc = c + dc * k;
      if(!inGrid(rr, cc, N)) return false;
      const cur = g[rr][cc];
      if(cur){ if(cur !== w[k]) return false; crosses++; continue; }
      if(inGrid(rr + pr, cc + pc, N) && g[rr + pr][cc + pc]) return false;
      if(inGrid(rr - pr, cc - pc, N) && g[rr - pr][cc - pc]) return false;
    }
    return crosses > 0;
  };
  if(!words.length) return { placed };
  const first = words.shift();
  const r0 = Math.floor(N / 2), c0 = Math.floor((N - first.w.length) / 2);
  put(first, r0, c0, 0);
  placed.push({ ...first, r: r0, c: c0, d: 0 });
  for(const it of words){
    let ok = false;
    for(const p of placed){
      if(ok) break;
      for(let j = 0; j < p.w.length && !ok; j++){
        const pr0 = p.d ? p.r + j : p.r, pc0 = p.d ? p.c : p.c + j;
        for(let i = 0; i < it.w.length && !ok; i++){
          if(it.w[i] !== p.w[j]) continue;
          const d = 1 - p.d;
          const r = d ? pr0 - i : pr0, c = d ? pc0 : pc0 - i;
          if(fits(it.w, r, c, d)){ put(it, r, c, d); placed.push({ ...it, r, c, d }); ok = true; }
        }
      }
    }
  }
  return { placed };
}

function runCrossword(){
  const entry = pool(PUZZLE_BANK, 1)[0];
  const xw = buildCrossword(entry.words.slice(0, 10));
  const placed = xw.placed;
  const cellsAbs = {};
  placed.forEach(p => { for(let k = 0; k < p.w.length; k++){
    cellsAbs[(p.r + (p.d ? k : 0)) + "," + (p.c + (p.d ? 0 : k))] = p.w[k];
  } });
  const keys = Object.keys(cellsAbs).map(k => k.split(",").map(Number));
  const minR = Math.min(...keys.map(x => x[0])), maxR = Math.max(...keys.map(x => x[0]));
  const minC = Math.min(...keys.map(x => x[1])), maxC = Math.max(...keys.map(x => x[1]));
  const W = maxC - minC + 1, H = maxR - minR + 1;
  const starts = {};
  [...new Set(placed.map(p => p.r + "," + p.c))]
    .map(s => s.split(",").map(Number))
    .sort((a,b) => a[0] - b[0] || a[1] - b[1])
    .forEach((s, i) => { starts[s[0] + "," + s[1]] = i + 1; });
  const byNumber = (a, b) => starts[a.r + "," + a.c] - starts[b.r + "," + b.c];
  const across = placed.filter(p => !p.d).sort(byNumber);
  const down = placed.filter(p => p.d).sort(byNumber);
  let grid = "";
  for(let r = minR; r <= maxR; r++){
    for(let c = minC; c <= maxC; c++){
      const key = r + "," + c, L = cellsAbs[key];
      if(!L){ grid += "<div></div>"; continue; }
      const n = starts[key];
      grid += `<div class="xc">${n ? `<span class="xn">${n}</span>` : ""}<input maxlength="1" data-key="${key}" data-a="${L}" autocomplete="off"></div>`;
    }
  }
  const clue = p => `<li><strong>${starts[p.r + "," + p.c]}.</strong> ${escapeHtml(p.clue)} (${p.w.length})</li>`;
  stage().innerHTML = `
    <div class="card">
      <span class="badge b-head">Head - Crossword</span>
      <h2>${entry.title}</h2>
      ${notice([entry])}
      <div class="xw" style="grid-template-columns:repeat(${W},minmax(0,1fr))">${grid}</div>
      <div class="clues">
        <div><strong>Across</strong><ol style="padding-left:18px">${across.map(clue).join("")}</ol></div>
        <div><strong>Down</strong><ol style="padding-left:18px">${down.map(clue).join("")}</ol></div>
      </div>
      <button id="xw-check">Check answers</button>
      <div id="xw-res"></div>
    </div>`;
  document.getElementById("xw-check").onclick = () => {
    let solved = 0;
    document.querySelectorAll(".xc input").forEach(inp => {
      const ok = inp.value.trim().toUpperCase() === inp.dataset.a;
      inp.style.color = ok ? "#2e8b57" : "#c0475b";
    });
    placed.forEach(p => {
      let all = true;
      for(let k = 0; k < p.w.length; k++){
        const key = (p.r + (p.d ? k : 0)) + "," + (p.c + (p.d ? 0 : k));
        const inp = document.querySelector(`.xc input[data-key="${key}"]`);
        if(!inp || inp.value.trim().toUpperCase() !== p.w[k]) all = false;
      }
      if(all) solved++;
      addReview(p.clue, p.w, all);
    });
    document.getElementById("xw-res").innerHTML = `
      <div class="feedback"><span class="score">${solved} of ${placed.length} words correct</span></div>
      <button id="xw-next">Continue to Heart and Hands</button>`;
    document.getElementById("xw-next").onclick = () => withHH("Bible Crossword", solved, placed.length,
      "Which person or place from this crossword would you like to read about more?",
      "Read the story of one name from this crossword in your Bible or audio Bible this week.");
  };
}

function buildWordSearch(words, size){
  const g = Array.from({length:size}, () => Array(size).fill(""));
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  const placed = [];
  for(const w of words){
    for(let t = 0, ok = false; t < 400 && !ok; t++){
      const [dr, dc] = dirs[Math.floor(Math.random() * dirs.length)];
      const r = Math.floor(Math.random() * size), c = Math.floor(Math.random() * size);
      if(!inGrid(r, c, size) || !inGrid(r + dr * (w.length - 1), c + dc * (w.length - 1), size)) continue;
      let good = true;
      for(let k = 0; k < w.length && good; k++){ const cur = g[r + dr * k][c + dc * k]; if(cur && cur !== w[k]) good = false; }
      if(!good) continue;
      for(let k = 0; k < w.length; k++) g[r + dr * k][c + dc * k] = w[k];
      placed.push({ w, r, c, dr, dc });
      ok = true;
    }
  }
  const L = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let r = 0; r < size; r++) for(let c = 0; c < size; c++) if(!g[r][c]) g[r][c] = L[Math.floor(Math.random() * 26)];
  return { grid: g, placed, size };
}

function runWordSearch(){
  const entry = pool(PUZZLE_BANK, 1)[0];
  const ws = buildWordSearch(entry.words.slice(0, 8).map(x => x.w), 12);
  const total = ws.placed.length;
  const found = new Set();
  let sel = null;
  stage().innerHTML = `
    <div class="card">
      <span class="badge b-head">Head - Word Search</span>
      <h2>${entry.title}</h2>
      ${notice([entry])}
      <p class="muted">Tap the first letter, then the last letter of a word. Words run across, down or diagonally, and may be backwards.</p>
      <div class="ws" id="ws-grid" style="grid-template-columns:repeat(${ws.size},minmax(0,1fr))">
        ${ws.grid.map((row, r) => row.map((l, c) => `<div data-r="${r}" data-c="${c}">${l}</div>`).join("")).join("")}
      </div>
      <p><strong>Find:</strong> ${ws.placed.map(p => `<span class="wsw" data-w="${p.w}">${p.w}</span>`).join("")}</p>
      <div id="ws-res"></div>
      <button id="ws-finish" class="alt">Finish now</button>
    </div>`;
  const finish = () => { entry.words.forEach(x => { if(ws.placed.some(p => p.w === x.w)) addReview(x.clue, x.w, found.has(x.w)); });
    return withHH("Word Search", found.size, total,
    "Which word from this search reminded you of a story you know well?",
    "Tell one person about the Bible story behind one of the words you found."); };
  document.getElementById("ws-finish").onclick = finish;
  document.getElementById("ws-grid").onclick = e => {
    const cell = e.target.closest("[data-r]");
    if(!cell) return;
    const r = +cell.dataset.r, c = +cell.dataset.c;
    if(!sel){ sel = { r, c }; cell.classList.add("sel"); return; }
    const a = sel;
    sel = null;
    document.querySelectorAll("#ws-grid .sel").forEach(x => x.classList.remove("sel"));
    const len = Math.max(Math.abs(r - a.r), Math.abs(c - a.c)) + 1;
    const straight = a.r === r || a.c === c || Math.abs(r - a.r) === Math.abs(c - a.c);
    if(len < 2 || !straight){ toast("Select cells in a straight line"); return; }
    const dr = Math.sign(r - a.r), dc = Math.sign(c - a.c);
    const cells = [];
    let s = "";
    for(let k = 0; k < len; k++){
      const rr = a.r + dr * k, cc = a.c + dc * k;
      cells.push([rr, cc]);
      s += ws.grid[rr][cc];
    }
    const rev = s.split("").reverse().join("");
    const hit = ws.placed.find(p => !found.has(p.w) && (s === p.w || rev === p.w));
    if(!hit){ toast("Not a word in the list"); return; }
    found.add(hit.w);
    cells.forEach(([rr, cc]) => document.querySelector(`#ws-grid [data-r="${rr}"][data-c="${cc}"]`).classList.add("found"));
    document.querySelector(`.wsw[data-w="${hit.w}"]`).classList.add("done");
    if(found.size === total){
      document.getElementById("ws-res").innerHTML = `
        <div class="feedback"><span class="score">All ${total} words found</span></div>
        <button id="ws-next">Continue to Heart and Hands</button>`;
      document.getElementById("ws-next").onclick = finish;
    }
  };
}

/* Typed-answer runner: one question at a time */
function typedRun(items, build, answerOf, onFinish, i = 0, score = 0){
  if(i >= items.length) return onFinish(score, items.length);
  const it = items[i];
  stage().innerHTML = `
    <div class="card">
      <p class="muted">Question ${i + 1} of ${items.length}</p>
      ${build(it)}
      <input type="text" id="tx" autocomplete="off" placeholder="Type your answer">
      <div style="margin-top:8px"><button id="tx-go">Check</button></div>
      <div id="tx-fb"></div>
    </div>`;
  const input = document.getElementById("tx");
  input.focus();
  const go = () => {
    const btn = document.getElementById("tx-go");
    if(btn.disabled) return;
    const v = normAns(input.value);
    const right = v === normAns(answerOf(it)) || (it.accept || []).some(a => normAns(a) === v);
    addReview(it.q || it.clue || it.quote || "", answerOf(it), right);
    btn.disabled = true;
    input.disabled = true;
    document.getElementById("tx-fb").innerHTML = `
      <div class="feedback">${right ? "Correct." : `Not quite. The answer was: <strong>${escapeHtml(answerOf(it))}</strong>.`} ${escapeHtml(it.info || "")}</div>
      <button id="tx-next">${i + 1 < items.length ? "Next question" : "See result"}</button>`;
    document.getElementById("tx-next").onclick = () => typedRun(items, build, answerOf, onFinish, i + 1, score + (right ? 1 : 0));
  };
  document.getElementById("tx-go").onclick = go;
  input.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
}

/* 8. Bible Characters (Text): read clues, type the name */
function runCharactersText(){
  const deck = shuffleArr(BIBLE_CHARS.filter(c => TEST(c.book) === ctx.testament)).concat(shuffleArr(BIBLE_CHARS.filter(c => TEST(c.book) !== ctx.testament)));
  const chars = deck.slice(0, CHAR_ROUND);
  let lives = 3, points = 0;
  const end = () => withHH("Bible Characters (Text)", points, chars.length * 5,
    `You scored ${points} of ${chars.length * 5} points. Which character from today encouraged you most?`,
    "Tell someone about one Bible character you met today and what you learned from them.");
  const round = (i, shown) => {
    if(lives <= 0 || i >= chars.length) return end();
    const c = chars[i];
    stage().innerHTML = `
      <div class="card">
        <span class="badge b-game">Character ${i + 1} of ${chars.length}</span>
        <div class="feedback">Lives: ${"❤️".repeat(lives)} &nbsp; Points: <span class="score">${points}</span></div>
        <ol>${c.clues.slice(0, shown).map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ol>
        ${shown < c.clues.length ? '<button id="tc-clue" class="alt">Reveal next clue</button>' : ""}
        <div style="margin-top:8px"><input type="text" id="tc" autocomplete="off" placeholder="Type the character's name"></div>
        <div style="margin-top:8px"><button id="tc-go">Guess</button></div>
        <div id="tc-fb"></div>
      </div>`;
    const clueBtn = document.getElementById("tc-clue");
    if(clueBtn) clueBtn.onclick = () => round(i, shown + 1);
    const guess = () => {
      const btn = document.getElementById("tc-go");
      if(btn.disabled) return;
      const v = normAns(document.getElementById("tc").value);
      if(v === normAns(c.name)){
        points += 6 - shown;
        addReview("Who am I? (" + c.ref + ")", c.name, true);
        btn.disabled = true;
        document.getElementById("tc-fb").innerHTML = `<div class="feedback"><span class="score">Correct: ${escapeHtml(c.name)}</span> (+${6 - shown} points)<br>${escapeHtml(c.info)}</div><button id="tc-next">Next character</button>`;
      } else {
        lives--;
        btn.disabled = true;
        const out = lives <= 0;
        if(out) addReview("Who am I? (" + c.ref + ")", c.name, false);
        document.getElementById("tc-fb").innerHTML = out
          ? `<div class="feedback">Out of lives. The answer was <strong>${escapeHtml(c.name)}</strong>.<br>${escapeHtml(c.info)}</div><button id="tc-next">${T("finish")}</button>`
          : `<div class="feedback">Not quite. You lost a life. Reveal another clue, or guess again.</div><button id="tc-again">Guess again</button>`;
        if(!out) document.getElementById("tc-again").onclick = () => round(i, shown);
      }
      const next = document.getElementById("tc-next");
      if(next) next.onclick = () => round(i + 1, 1);
    };
    document.getElementById("tc-go").onclick = guess;
    document.getElementById("tc").addEventListener("keydown", e => { if(e.key === "Enter") guess(); });
  };
  textIntro("Bible Characters (Text)", `<h2>Who am I?</h2><p>${CHAR_ROUND} characters. Read the clues, then type the name. Fewer clues used means more points.</p>`, () => round(0, 1));
}

/* 10. Word Unscramble (Text): unscramble each Bible word, using its clue */
function scrambleWord(w){
  for(let t = 0; t < 30; t++){
    const s = shuffleArr(w.split("")).join("");
    if(s !== w) return s;
  }
  return w;
}
function runWordSearchText(){
  const entry = pool(PUZZLE_BANK, 1)[0];
  const items = shuffleArr(entry.words).slice(0, 8).map(x => ({ q: `Unscramble: ${scrambleWord(x.w)}`, clue: x.clue, answer: x.w, info: "" }));
  textIntro("Word Unscramble (Text)", `<h2>${entry.title}</h2><p>Eight Bible words are scrambled. Each has a clue. Type the correct word.</p>`, () =>
    typedRun(items, it => `<h3>${escapeHtml(it.q)}</h3><p class="muted">Clue: ${escapeHtml(it.clue)}</p>`, it => it.answer, (score, total) =>
      withHH("Word Unscramble (Text)", score, total,
        "Which of these words reminded you of a story you know well?",
        "Tell one person about the Bible story behind one of the words you unscrambled.")));
}

const tagsOf = g => [...new Set(g.formats.map(f => f.tag))];
function featureOn(tag){ return tag === "text" || ((APP_CONFIG.features || {})[tag] === true); }
function soonNote(){
  if(gameFilter === "all" || gameFilter === "text" || featureOn(gameFilter)) return "";
  const name = gameFilter === "audio" ? "Audio" : "Video";
  return `<div class="soon"><strong>${name} games: coming soon.</strong> These games are available in text now. ${name} versions will be added when ${name.toLowerCase()} content is connected.</div>`;
}

function setFilter(f){ gameFilter = f; renderGames(); }
function loadCatalog(){
  const norm = c => ({ countries: (c.countries || []).map(co => ({
    code: co.code, name: co.name,
    languages: (co.languages || []).map(la => ({
      code: la.code, name: la.name,
      versions: (la.versions || []).map(v => {
        const fileset = v.fileset || v.id;
        // a version is playable only when its text was published (text/catalog.json marks it available)
        const available = ("available" in v) ? !!v.available : false;
        return { fileset, name: v.name, available };
      }).filter(v => v.fileset)
    })).filter(la => la.versions.length)
  })).filter(co => co.languages.length) });
  // Prefer the published catalogue; otherwise show the configured list (all versions marked coming soon)
  return fetch("text/catalog.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : null)
    .then(c => c || fetch("bible-catalog.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null))
    .then(c => { if(c && Array.isArray(c.countries)) BIBLE_CATALOG = norm(c); })
    .catch(() => {});
}
function currentBible(){
  const C = BIBLE_CATALOG.countries;
  const saved = DB.settings.bible || {};
  if(!C.length) return { country: null, lang: null, fileset: null, available: false, name: "King James Version (built-in)" };
  const c = C.find(x => x.code === saved.country) || C[0];
  const l = c.languages.find(x => x.code === saved.lang) || c.languages[0];
  const v = l.versions.find(x => x.fileset === saved.fileset) || l.versions[0];
  return { country: c.code, lang: l.code, fileset: v.fileset, available: v.available, name: v.name };
}
function setBible(country, lang, fileset){
  DB.settings.bible = { country, lang, fileset };
  saveDB();
  renderBiblePicker();
}
function renderBiblePicker(){
  const el = document.getElementById("bible-picker");
  if(!el) return;
  const C = BIBLE_CATALOG.countries;
  if(!C.length){
    el.innerHTML = `<p class="muted">Bible text: King James Version (built-in).</p>`;
    return;
  }
  const cur = currentBible();
  const c = C.find(x => x.code === cur.country) || C[0];
  const l = c.languages.find(x => x.code === cur.lang) || c.languages[0];
  const label = v => v.name + (v.available ? "" : " (coming soon)");
  const sel = (id, items, val, text) => `
    <label class="muted" for="${id}" style="display:block;margin-top:8px">${text}</label>
    <select id="${id}" class="sel" style="width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid rgba(127,127,127,.4);background:var(--bg);color:var(--ink)">${items.map(([v, t]) => `<option value="${escapeHtml(v)}" ${v === val ? "selected" : ""}>${escapeHtml(t)}</option>`).join("")}</select>`;
  el.innerHTML = sel("b-country", C.map(x => [x.code, x.name]), c.code, "Country")
               + sel("b-lang", c.languages.map(x => [x.code, x.name]), l.code, "Language")
               + sel("b-ver", l.versions.map(x => [x.fileset, label(x)]), cur.fileset, "Version")
               + `<p class="muted" style="font-size:.8rem;margin-top:6px">Passages in Echo use this version. Versions marked "coming soon" are not published yet, so the built-in text is used.</p>`;
  document.getElementById("b-country").onchange = e => {
    const nc = C.find(x => x.code === e.target.value);
    setBible(nc.code, nc.languages[0].code, nc.languages[0].versions[0].fileset);
  };
  document.getElementById("b-lang").onchange = e => {
    const nl = c.languages.find(x => x.code === e.target.value);
    setBible(c.code, nl.code, nl.versions[0].fileset);
  };
  document.getElementById("b-ver").onchange = e => setBible(c.code, l.code, e.target.value);
}

function renderGames(){

/* ----- Bible Brain text: passage references and language ----- */
const BOOK_CODE_LIST = ["GEN","EXO","LEV","NUM","DEU","JOS","JDG","RUT","1SA","2SA","1KI","2KI","1CH","2CH","EZR","NEH","EST","JOB","PSA","PRO","ECC","SNG","ISA","JER","LAM","EZK","DAN","HOS","JOL","AMO","OBA","JON","MIC","NAM","HAB","ZEP","HAG","ZEC","MAL","MAT","MRK","LUK","JHN","ACT","ROM","1CO","2CO","GAL","EPH","PHP","COL","1TH","2TH","1TI","2TI","TIT","PHM","HEB","JAS","1PE","2PE","1JN","2JN","3JN","JUD","REV"];
const BOOK_CODES = {};
[...OT_BOOKS, ...NT_BOOKS].forEach((name, i) => { BOOK_CODES[name] = BOOK_CODE_LIST[i]; });
function parseRef(ref){
  const m = /^(.+?)\s+(\d+)(?::(\d+)(?:-(\d+))?)?$/.exec(String(ref).trim());
  if(!m) return null;
  const code = BOOK_CODES[m[1].trim()];
  if(!code) return null;
  const ch = +m[2];
  const from = m[3] ? +m[3] : 1;
  const to = m[4] ? +m[4] : (m[3] ? from : 999);
  return { code, ch, from, to };
}
async function fetchPassage(ref){
  const bible = currentBible();
  if(!bible.fileset || !bible.available) return null;
  const p = parseRef(ref);
  if(!p) return null;
  const base = (APP_CONFIG.api && APP_CONFIG.api.base) || "";
  const isStatic = !!((APP_CONFIG.staticText || {}).enabled);
  if(!isStatic && !base) return null;
  const url = isStatic
    ? `text/${bible.fileset}/${p.code}/${p.ch}.json`
    : `${base}/api/text/${bible.fileset}/${p.code}/${p.ch}`;
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    const j = await r.json();
    const verses = (j.verses || []).filter(v => v.verse >= p.from && v.verse <= p.to);
    return verses.length ? { text: verses.map(v => v.text).join(" "), name: bible.name } : null;
  }catch(e){ return null; }
}
